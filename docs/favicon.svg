<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Favicon facon fenetre Windows XP (Luna bleu) avec les initiales KC -->
    <defs>
        <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3d95ff"/>
            <stop offset="0.12" stop-color="#0a5fe8"/>
            <stop offset="0.55" stop-color="#0050d8"/>
            <stop offset="1" stop-color="#0042b8"/>
        </linearGradient>
        <linearGradient id="close" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f08a6c"/>
            <stop offset="1" stop-color="#c8361b"/>
        </linearGradient>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#ece9d8"/>
        </linearGradient>
    </defs>
    <!-- cadre bleu de la fenetre -->
    <path d="M8 3h48a6 6 0 0 1 6 6v51a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a6 6 0 0 1 6-6z" fill="url(#title)"/>
    <!-- reflet de la barre de titre -->
    <path d="M8 4.5h48a4.5 4.5 0 0 1 4.5 4.5v1H3.5V9A4.5 4.5 0 0 1 8 4.5z" fill="#fff" opacity=".25"/>
    <!-- bouton fermer -->
    <rect x="45" y="6.5" width="12" height="12" rx="2.5" fill="url(#close)" stroke="#fff" stroke-width="1.4"/>
    <path d="M48.3 9.8l5.4 5.4M53.7 9.8l-5.4 5.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <!-- zone de contenu -->
    <rect x="5" y="22" width="54" height="37" rx="1" fill="url(#body)"/>
    <text x="32" y="51" text-anchor="middle" font-family="Tahoma, Verdana, 'Segoe UI', sans-serif" font-size="25" font-weight="700" letter-spacing="-0.5" fill="#0a3fa8">KC</text>
</svg>
